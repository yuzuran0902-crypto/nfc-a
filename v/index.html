<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#180000" />
    <meta name="description" content="学園祭謎解き・真相ページ" />
    <title>真相｜Congratulations</title>
    <link rel="stylesheet" href="../style.css?v=20261023-4" />
  </head>
  <body class="truth-page">
    <main class="truth-shell">
      <figure class="truth-visual">
        <img
          src="../truth.png"
          alt="Congratulations!! 謎を解き明かした参加者への記念画像"
          width="2380"
          height="2380"
        />
      </figure>

      <div class="truth-actions" aria-label="真相ページの操作">
        <a class="truth-button truth-button-save" href="../truth.png" download="真相クリア画像.png">
          <span aria-hidden="true">↓</span>
          ファイルとして保存
        </a>
        <button class="truth-button truth-button-photo" id="save-photo" type="button">
          <span aria-hidden="true">▣</span>
          写真として保存
        </button>
        <a
          class="truth-button truth-button-video"
          href="https://youtu.be/KpbA5COsbdM"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span aria-hidden="true">▶</span>
          真相動画を見る
        </a>
      </div>
      <button class="truth-secret" type="button" disabled>
        <span aria-hidden="true">LOCKED</span>
        <strong>近日公開！マル秘資料</strong>
      </button>
      <p class="truth-save-help" id="save-help" aria-live="polite">
        iPhoneでは「写真として保存」を押し、共有メニューの「画像を保存」を選んでください。
      </p>
    </main>
    <script src="../truth.js"></script>
  </body>
</html>
